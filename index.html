<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .content {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 30px;
            color: #333;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Welcome</h1>
        <h2>I am Cris Brian G. Bactol</h2>
        <p>Hello! I am a student willing to learn programming and coding.<br>
        I love creating things and discovering new skills.</p>
    </div>
</body>
</html>
